name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build:
        description: Build all configurations instead of only evaluating them
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        type: string
        default: ""
      build:
        description: Build all configurations instead of only evaluating them
        type: boolean
        default: false
    secrets:
      CI_GITHUB_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: NixOS
            runner: ubuntu-24.04
          - platform: Darwin
            runner: macos-15
    uses: ./.github/workflows/ci-platform.yaml
    with:
      runner: ${{ matrix.runner }}
      ref: ${{ inputs.ref || '' }}
      build: ${{ inputs.build || false }}
    secrets:
      CI_GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
