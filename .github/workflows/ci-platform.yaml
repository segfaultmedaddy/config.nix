name: Native configuration CI

on:
  workflow_call:
    inputs:
      runner:
        description: Native runner for configuration discovery
        type: string
        required: true
      ref:
        description: Exact commit to validate
        type: string
        default: ""
      build:
        description: Build all configurations instead of only evaluating them
        type: boolean
        default: false
    secrets:
      CI_GITHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  targets:
    name: Discover configurations
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Provide CI-only hardware configuration
        if: runner.os == 'Linux'
        run: sudo install -Dm644 .github/ci/hardware-configuration.nix /etc/nixos/hardware-configuration.nix

      - name: Discover configurations for this OS
        id: targets
        shell: bash
        run: |
          matrix=$(nix eval --impure --json --no-update-lock-file \
            --file .github/ci/targets.nix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  validate:
    name: ${{ inputs.build && 'Build' || 'Validate' }} ${{ matrix.name }}
    needs: targets
    if: fromJSON(needs.targets.outputs.matrix).include[0].name != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.build && 360 || 30 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            extra-substituters = https://devenv.cachix.org https://vicinae.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= vicinae.cachix.org-1:1kDrfienkGHPYbkpNj1mWTr7Fm1+zcenzgTizIcI3oc=

      - name: Provide CI-only hardware configuration
        if: runner.os == 'Linux'
        run: sudo install -Dm644 .github/ci/hardware-configuration.nix /etc/nixos/hardware-configuration.nix

      - name: Evaluate system derivation
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          args=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            args+=(--impure)
          fi
          # Use the initialized submodule instead of refetching it over SSH.
          nix eval "${args[@]}" --raw --show-trace --no-update-lock-file \
            "path:.#$TARGET.drvPath"

      - name: Build system without activation
        if: inputs.build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          args=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            args+=(--impure)
          fi
          nix build "${args[@]}" --no-link --print-build-logs --show-trace --no-update-lock-file \
            "path:.#$TARGET"
